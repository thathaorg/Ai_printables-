<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 877" width="620" height="877">
  <!-- Pre-approved fallback worksheet: simple sun & flower coloring page -->
  <rect width="620" height="877" fill="white"/>
  <text x="30" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="black">Name: ____________</text>
  <text x="430" y="40" font-family="sans-serif" font-size="20" font-weight="bold" fill="black">Date: ______</text>
  <!-- sun -->
  <circle cx="480" cy="160" r="60" fill="none" stroke="black" stroke-width="5"/>
  <g stroke="black" stroke-width="5">
    <line x1="480" y1="70" x2="480" y2="40"/>
    <line x1="480" y1="250" x2="480" y2="280"/>
    <line x1="390" y1="160" x2="360" y2="160"/>
    <line x1="570" y1="160" x2="600" y2="160"/>
    <line x1="417" y1="97" x2="396" y2="76"/>
    <line x1="543" y1="223" x2="564" y2="244"/>
    <line x1="417" y1="223" x2="396" y2="244"/>
    <line x1="543" y1="97" x2="564" y2="76"/>
  </g>
  <!-- smiling face on sun -->
  <circle cx="460" cy="150" r="6" fill="black"/>
  <circle cx="500" cy="150" r="6" fill="black"/>
  <path d="M455 180 Q480 200 505 180" fill="none" stroke="black" stroke-width="4"/>
  <!-- big flower -->
  <g fill="none" stroke="black" stroke-width="5">
    <circle cx="240" cy="480" r="55"/>
    <ellipse cx="240" cy="370" rx="45" ry="60"/>
    <ellipse cx="240" cy="590" rx="45" ry="60"/>
    <ellipse cx="130" cy="480" rx="60" ry="45"/>
    <ellipse cx="350" cy="480" rx="60" ry="45"/>
    <ellipse cx="160" cy="400" rx="45" ry="45"/>
    <ellipse cx="320" cy="400" rx="45" ry="45"/>
    <ellipse cx="160" cy="560" rx="45" ry="45"/>
    <ellipse cx="320" cy="560" rx="45" ry="45"/>
  </g>
  <!-- stem and leaves -->
  <path d="M240 650 L240 820" stroke="black" stroke-width="6" fill="none"/>
  <path d="M240 720 Q170 690 150 740 Q200 770 240 730" fill="none" stroke="black" stroke-width="5"/>
  <path d="M240 770 Q310 740 330 790 Q280 820 240 780" fill="none" stroke="black" stroke-width="5"/>
  <!-- grass -->
  <g stroke="black" stroke-width="4" fill="none">
    <path d="M40 840 Q50 810 60 840"/>
    <path d="M90 845 Q100 815 110 845"/>
    <path d="M480 840 Q490 810 500 840"/>
    <path d="M540 845 Q550 815 560 845"/>
  </g>
</svg>
